name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # SEC-9: fail the build if a secret (API key, token, .env value) is committed.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Dependency vulnerability gate (MF-1): block on high/critical advisories in
  #    shipped RUNTIME deps for both stacks. Dev-only tooling advisories are out
  #    of scope (npm --omit=dev; explicit allowlist lives in the scripts below).
  dependency-audit:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      # ---- Frontend (npm): high/critical RUNTIME advisories only ----
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend dependency audit (npm, high/critical runtime)
        working-directory: frontend
        # Wraps `npm audit --omit=dev --json`; fails on any high/critical runtime
        # advisory that is not in the explicit, justified allowlist inside the
        # script. Dev tooling (vitest/vite/esbuild) is excluded via --omit=dev.
        run: node scripts/check-npm-audit.mjs

      # ---- Backend (pip-audit): advisories in pinned requirements.txt ----
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend dependency audit (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit
          # Fail on advisories in runtime deps. Accepted / not-yet-fixable ones are
          # allowlisted explicitly with a justification below — only below-high
          # severity or provably-unreachable issues belong here:
          #   langchain-core (PYSEC-2026-2193, PYSEC-2026-2562): the upstream fix
          #   lands only in langchain-core 1.x, a MAJOR upgrade that is incompatible
          #   with the pinned langchain-mistralai/langchain-groq 0.x partner
          #   packages and changes the chat-model API the tutor relies on. Deferred
          #   to a separate, tested langchain 1.x migration; app does not feed
          #   untrusted input through the affected code path.
          #
          #   starlette (PYSEC-2026-161/248/249/1941/1942/2280/2281): every fix
          #   ships only in starlette >=0.47 / 1.x, but the app MUST pin starlette
          #   0.41.x because FastAPI's include_router registers ZERO routes on
          #   starlette 1.x (verified locally: fastapi 0.141.1 + starlette 1.6.0 ->
          #   0 routes), which would delete the entire API surface in production.
          #   Of the seven: 2281 (Windows-only StaticFiles SSRF) and 2280 (raw
          #   HTTPEndpoint dispatch) don't apply — this app runs on Linux and uses
          #   FastAPI APIRoute, not StaticFiles/HTTPEndpoint; the remainder are
          #   DoS-class, mitigated by the reverse proxy + request/upload limits.
          #   Tracked pending a FastAPI+Starlette combo that keeps include_router.
          #   e.g.  --ignore-vuln GHSA-xxxx-xxxx-xxxx  # <package>: <why accepted>
          pip-audit -r requirements.txt --desc \
            --ignore-vuln PYSEC-2026-2193 \
            --ignore-vuln PYSEC-2026-2562 \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-1942 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281

  # ── Backend unit tests + coverage gates (fast, DB stubbed) ──
  backend-unit:
    runs-on: ubuntu-latest
    needs: secret-scan
    # The LLM registry now hard-fails at import if no provider keys are present.
    # Unit/route tests mock the actual LLM calls, so dummy keys are enough to let
    # the app initialize (same approach the e2e job already uses).
    env:
      MISTRAL_API_KEY_1: "ci-dummy-key"
      GROQ_API_KEY_1: "ci-dummy-key"
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests with coverage
        env:
          MONGODB_URI: "mongodb://localhost:27017"
          DB_NAME: "test_db"
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          ENVIRONMENT: "test"
        run: |
          # Integration tests run here too (against mongomock — no server needed),
          # which is what lifts database.py / dependencies.py coverage. The
          # backend-integration job re-runs them against a real mongo:7 for fidelity.
          pytest tests/ -q \
            --cov=auth_config --cov=security --cov=dependencies --cov=rate_limit \
            --cov=database --cov=auth --cov=core --cov=api --cov=models --cov=routers \
            --cov=serve --cov=repositories --cov=services \
            --cov-report=term-missing
      - name: Coverage gate — security-critical modules >= 90%
        run: |
          coverage report \
            --include="auth_config.py,security.py,dependencies.py,database.py" \
            --fail-under=90
      - name: Coverage gate — testable backend floor >= 48% (T1.1/T1.5 ratchet)
        # serve.py + api/extras.py are now MEASURED (un-omitted; route tests in
        # tests/test_routes_*.py exercise them with mongomock + a fake LLM,
        # including learning-loop / materials / chat lifecycles). Sandbox measured
        # ~51%; floor set conservatively at 48. Ratchet target: 60 (mid) -> 80.
        run: coverage report --fail-under=48
      - name: App import smoke test (separate process — serve.py builds LLM singletons)
        env:
          MONGODB_URI: "mongodb://localhost:27017"
          DB_NAME: "test_db"
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          ENVIRONMENT: "test"
          RUN_APP_SMOKE: "1"
        run: pytest tests/test_app_routes.py -q

  # ── Backend integration tests against a REAL MongoDB service ──
  backend-integration:
    runs-on: ubuntu-latest
    needs: secret-scan
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Integration tests (real Mongo service)
        env:
          MONGODB_URI: "mongodb://localhost:27017"
          DB_NAME: "test_integration"
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          ENVIRONMENT: "test"
          INTEGRATION_TESTS: "1"
          INTEGRATION_REAL_MONGO: "1"
        run: pytest tests/integration -v

  # ── Frontend lint + unit/component/a11y tests + production build ──
  frontend:
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # W7: blocking again — lint is clean (0 errors). Warnings stay advisory
      # (the script no longer uses --max-warnings=0); errors fail the build.
      - name: Lint
        run: npm run lint
      - name: Unit / component / a11y tests
        run: npm test
      - name: Production build
        run: npm run build

  # ── End-to-end (Playwright) against the full stack ──
  e2e:
    runs-on: ubuntu-latest
    needs: [backend-integration, frontend]
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Install frontend + Playwright browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start backend (uvicorn :8000)
        env:
          MONGODB_URI: "mongodb://localhost:27017"
          DB_NAME: "e2e"
          SECRET_KEY: "e2e-only-strong-secret-key-0123456789-abcdef"
          ENVIRONMENT: "test"
          # Engines build an LLM model at construction, so at least one provider
          # key must be present for the app to import. LLM calls aren't exercised
          # by the E2E flows (those steps are skipped), so dummy keys are fine.
          MISTRAL_API_KEY_1: "e2e-dummy-key"
          GROQ_API_KEY_1: "e2e-dummy-key"
          # Auto-verify new signups so the E2E auth flow can log in without a real
          # mailbox (strictly non-production; see auth.py _AUTO_VERIFY_SIGNUP).
          E2E_AUTO_VERIFY: "1"
          # The suite signs up + logs in several times from one IP; login/signup are
          # 5/minute per IP, so disable rate limits for the E2E run (prod ignores this).
          RATE_LIMIT_DISABLED: "1"
        run: |
          uvicorn serve:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz && break || sleep 2;
          done
      - name: Start frontend (vite dev :5173, proxies /api -> :8000)
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173 && break || sleep 2;
          done
      - name: Run Playwright E2E
        working-directory: frontend
        env:
          E2E_BASE_URL: "http://localhost:5173"
          CI: "true"
        run: npm run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
