services:
  - type: web
    name: digital-tutor-adaptive
    env: python
    region: oregon
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn serve:app --host 0.0.0.0 --port $PORT --workers 4
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: adaptive_learning
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: VERIFY_TOKEN_TTL_SECONDS
        value: "86400"
      - key: RESET_TOKEN_TTL_SECONDS
        value: "3600"
      - key: RATE_LIMIT_STORAGE_URI
        value: memory://
      - key: RATE_LIMIT_DEFAULT
        value: "120/minute"
      - key: LLM_DAILY_REQUEST_CAP
        value: "300"
      - key: RL_ONLINE_LEARNING
        value: "0"
      - key: ALLOWED_ORIGINS
        value: "https://ai-digital-tutor.vercel.app"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: "AI TUTOR <jitenbharga40@gmail.com>"
      - key: BREVO_SENDER_NAME
        value: "Digital Tutor"
      - key: APP_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_RATE
        value: "0.1"
      - key: LOG_FORMAT
        value: "json"
      - key: AUTO_ENSURE_INDEXES
        value: "0"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCKOUT_MINUTES
        value: "15"
      - key: MISTRAL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false