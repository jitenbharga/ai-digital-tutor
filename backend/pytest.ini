[pytest]
testpaths = tests
asyncio_mode = strict

# Registered markers (avoids PytestUnknownMarkWarning)
markers =
    integration: exercises a real/mocked MongoDB engine (see tests/integration)

# Keep output readable: the app intentionally still uses on_event (migrated in a
# later wave); silence just that deprecation so real warnings stay visible.
filterwarnings =
    ignore:.*on_event is deprecated.*:DeprecationWarning
