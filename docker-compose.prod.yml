# ============================================================
# Production overrides (SEC M-9). Use together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Provide these via a real secret store or an uncommitted env file:
#   MONGO_ROOT_USER, MONGO_ROOT_PASSWORD, SECRET_KEY (>=32 random chars)
# The DB/cache ports are NOT published here — put the API behind a TLS reverse
# proxy and keep Mongo/Redis on the internal compose network only.
# ============================================================

services:
  mongo:
    command: ["mongod", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
    ports: []          # do not expose the database to the host in production

  redis:
    ports: []          # internal only

  api:
    environment:
      ENVIRONMENT: production
      # Authenticated connection string (authSource=admin for the root user).
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      # Shared rate-limit store is already wired in the base file (redis://redis:6379).
      # Indexes are created by the migration step, not lazily at startup:
      AUTO_ENSURE_INDEXES: "0"

  frontend:
    ports:
      - "80:80"          # front this with TLS termination (e.g. a proxy / LB)
