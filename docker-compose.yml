version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  user:
    build:
      context: ./user
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=development
      - JWT_SECRET_KEY=dev-secret-key-change-in-production-min-32-chars
      - MONGODB_URI=mongodb://mongo:27017
      - DB_NAME=digital_tutor
      - RATE_LIMIT_STORAGE_URI=redis://redis:6379
      - RATE_LIMIT_DISABLED=1
      - ALLOWED_ORIGINS=http://localhost:5173
      - APP_BASE_URL=http://localhost:5173
      - ADAPTIVE_ENGINE_URL=http://adaptive:8000
      - LOG_FORMAT=json
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - ./user:/app

  adaptive:
    build:
      context: ./adaptive
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - JWT_SECRET_KEY=dev-secret-key-change-in-production-min-32-chars
      - MONGODB_URI=mongodb://mongo:27017
      - DB_NAME=digital_tutor
      - RATE_LIMIT_STORAGE_URI=redis://redis:6379
      - RATE_LIMIT_DISABLED=1
      - ALLOWED_ORIGINS=http://localhost:5173
      - APP_BASE_URL=http://localhost:5173
      - LOG_FORMAT=json
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - ./adaptive:/app

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8001
      - VITE_ADAPTIVE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - user
      - adaptive

volumes:
  redis_data:
  mongo_data: