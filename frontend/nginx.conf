server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API requests → backend container
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;           # needed for SSE streaming
        proxy_read_timeout 300s;
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        # ── Security headers (BUG-4 / SEC-4) ──────────────────────────────────
        # FastAPI's SecurityHeadersMiddleware only covers /api responses; the
        # nginx-served SPA shell (index.html) + hashed static assets need the
        # same protection. These mirror serve.py::_CSP exactly. 'always' emits
        # them on error/3xx responses too. Scoped to this block so proxied /api
        # responses keep the backend's headers (no duplicates).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: blob:; font-src 'self' data: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://tessdata.projectnaptha.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # HSTS is only honored over HTTPS (harmless on plain HTTP). Effective once
        # TLS terminates here or at the proxy in front (see Phase 5).
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        try_files $uri $uri/ /index.html;
    }
}
