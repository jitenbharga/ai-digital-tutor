[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-digital-tutor-backend"
version = "1.0.0"
description = "AI Digital Tutor Auth & Gateway Backend API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "motor>=3.3.0",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "pwdlib[argon2]>=0.2.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0"
]

[tool.vercel]
entrypoint = "api.index:handler"
