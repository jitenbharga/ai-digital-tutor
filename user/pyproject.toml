[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-digital-tutor-user-auth"
version = "1.0.0"
description = "AI Digital Tutor User & Auth Service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "email-validator>=2.0.0",
    "motor>=3.3.0",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "pwdlib[argon2]>=0.2.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "prometheus-client>=0.20.0",
    "sentry-sdk>=2.0.0",
    "sib-api-v3-sdk>=6.0.0",
    "google-auth>=2.0.0",
    "redis>=5.0.0",
    "python-multipart>=0.0.9"
]

[tool.setuptools]
py-modules = ["serve", "auth", "auth_config", "database", "dependencies", "rate_limit", "security", "ai_proxy"]
packages = ["api", "core", "repositories", "services"]

[tool.vercel]
entrypoint = "api.index:handler"
